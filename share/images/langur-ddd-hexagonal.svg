<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="m-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="m-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
    <marker id="m-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
    <marker id="m-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="m-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="m-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0d9488"/></marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" fill="#111827" font-size="18" font-weight="700">DDD 六边形分层（6 Maven 模块）</text>
  <rect x="370" y="240" width="220" height="100" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="480" y="288" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">domain</text>
  <text x="480" y="305" text-anchor="middle" fill="#6b7280" font-size="11">领域层 · 零外部依赖（P1）</text>
  <rect x="160" y="60" width="200" height="80" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="260" y="98" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">start</text>
  <text x="260" y="115" text-anchor="middle" fill="#6b7280" font-size="11">启动装配层</text>
  <rect x="160" y="180" width="200" height="80" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="260" y="218" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">api</text>
  <text x="260" y="235" text-anchor="middle" fill="#6b7280" font-size="11">接口层（REST/SSE）</text>
  <rect x="160" y="300" width="200" height="80" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="260" y="338" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">application</text>
  <text x="260" y="355" text-anchor="middle" fill="#6b7280" font-size="11">应用编排层</text>
  <rect x="640" y="180" width="200" height="80" rx="8" ry="8" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="740" y="218" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">infrastructure</text>
  <text x="740" y="235" text-anchor="middle" fill="#6b7280" font-size="11">基础设施层</text>
  <rect x="160" y="440" width="200" height="80" rx="8" ry="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="260" y="478" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">common</text>
  <text x="260" y="495" text-anchor="middle" fill="#6b7280" font-size="11">公共基础（SPI 契约）</text>
  <line x1="360" y1="100" x2="360" y2="160" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m-blue)"/>
  <line x1="360" y1="260" x2="360" y2="280" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m-blue)"/>
  <line x1="370" y1="380" x2="380" y2="340" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m-blue)"/>
  <line x1="640" y1="220" x2="600" y2="270" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#m-purple)"/>
  <line x1="260" y1="440" x2="380" y2="380" stroke="#0d9488" stroke-width="1.5" fill="none" marker-end="url(#m-teal)"/>
  <text x="360" y="46" text-anchor="middle" fill="#6b7280" font-size="11">依赖方向（P2 单向无环）</text>
  <text x="600" y="440" text-anchor="middle" fill="#6b7280" font-size="12">start → api → application → domain ← infrastructure</text>
</svg>