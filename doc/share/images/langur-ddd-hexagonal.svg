  <text x="500" y="304" text-anchor="middle" fill="#6b7280" font-size="11" font-weight="400">领域层 · 零外部依赖（P1）</text>
  <rect x="660" y="180" width="200" height="80" rx="8" ry="8" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="760" y="217" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">infrastructure</text>
  <text x="760" y="234" text-anchor="middle" fill="#6b7280" font-size="11" font-weight="400">基础设施层</text>
  <rect x="390" y="440" width="220" height="80" rx="8" ry="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="500" y="477" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">common</text>
  <text x="500" y="494" text-anchor="middle" fill="#6b7280" font-size="11" font-weight="400">公共基础（SPI 契约）</text>
  <line x1="230" y1="140" x2="230" y2="178" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m-blue)"/>
  <line x1="230" y1="260" x2="230" y2="298" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m-blue)"/>
  <line x1="330" y1="320" x2="388" y2="320" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m-blue)"/>
  <line x1="660" y1="220" x2="612" y2="268" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#m-purple)"/>
  <line x1="500" y1="438" x2="500" y2="342" stroke="#0d9488" stroke-width="1.5" fill="none" marker-end="url(#m-teal)"/>
  <text x="230" y="46" text-anchor="middle" fill="#6b7280" font-size="11" font-weight="400">依赖方向（P2 单向无环）</text>
  <text x="480" y="537" text-anchor="middle" fill="#6b7280" font-size="12" font-weight="400">start → api → application → domain ← infrastructure</text>
