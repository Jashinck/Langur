  <text x="230" y="217" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">api</text>
  <text x="230" y="234" text-anchor="middle" fill="#6b7280" font-size="11" font-weight="400">接口层（REST/SSE）</text>
  <rect x="130" y="300" width="200" height="80" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="230" y="337" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">application</text>
  <text x="230" y="354" text-anchor="middle" fill="#6b7280" font-size="11" font-weight="400">应用编排层</text>
  <rect x="390" y="240" width="220" height="100" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
