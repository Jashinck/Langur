<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="m-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="m-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="m-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
    <marker id="m-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0d9488"/></marker>
  </defs>
  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" fill="#111827" font-size="19" font-weight="700">Harness 六要素 · 确定性调度闭环</text>

  <!-- ===== 决策平面横切带（顶部） ===== -->
  <rect x="40" y="48" width="1120" height="66" rx="8" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="600" y="74" text-anchor="middle" fill="#6d28d9" font-size="13" font-weight="700">决策平面 DecisionPort（Jev · System-1 判定层）— 横切 advisory · 只收紧不放松（P12）</text>
  <text x="600" y="96" text-anchor="middle" fill="#6b7280" font-size="10">J1–J10：① Workflow 闸门 ② 审批分级 ③ 产物验收 ④ 执行器择优 ⑤ 升降级 ⑥ 层路由 ⑦⑧ ReAct 完成/卡死 ⑨⑩ Skill DECISION</text>

  <!-- ===== advisory 注入箭头（决策平面 → E/T/C/L） ===== -->
  <line x1="125" y1="114" x2="125" y2="148" stroke="#ea580c" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#m-orange)"/>
  <line x1="315" y1="114" x2="315" y2="148" stroke="#ea580c" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#m-orange)"/>
  <line x1="505" y1="114" x2="505" y2="148" stroke="#ea580c" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#m-orange)"/>
  <line x1="885" y1="114" x2="885" y2="148" stroke="#ea580c" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#m-orange)"/>
  <text x="137" y="130" fill="#ea580c" font-size="9">advisory</text>

  <!-- ===== 正向流水箭头（E→T→C→S→L→V） ===== -->
  <line x1="210" y1="245" x2="228" y2="245" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#m-blue)"/>
  <line x1="400" y1="245" x2="418" y2="245" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#m-blue)"/>
  <line x1="590" y1="245" x2="608" y2="245" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#m-blue)"/>
  <line x1="780" y1="245" x2="798" y2="245" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#m-blue)"/>
  <line x1="970" y1="245" x2="988" y2="245" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#m-blue)"/>

  <!-- ===== 反馈闭环（V → E） ===== -->
  <path d="M 1025 340 C 1025 404, 175 404, 175 342" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="6,4" marker-end="url(#m-blue)"/>
  <text x="600" y="398" text-anchor="middle" fill="#2563eb" font-size="9.5">未终止 → 下一轮 · 终止闸门判定</text>

  <!-- ===== E 执行 ===== -->
  <rect x="40" y="150" width="170" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="41" y="151" width="168" height="4" rx="2" fill="#2563eb"/>
  <text x="125" y="180" text-anchor="middle" fill="#1e40af" font-size="12.5" font-weight="700">执行 Execution</text>
  <text x="125" y="203" text-anchor="middle" fill="#374151" font-size="9">ReAct · PlanAndExecute</text>
  <text x="125" y="220" text-anchor="middle" fill="#374151" font-size="9">Workflow · Hybrid</text>
  <text x="125" y="243" text-anchor="middle" fill="#374151" font-size="9">终止闸门 + 循环检测</text>
  <text x="125" y="260" text-anchor="middle" fill="#374151" font-size="9">层路由 · 容错降级</text>

  <!-- ===== T 工具 ===== -->
  <rect x="230" y="150" width="170" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="231" y="151" width="168" height="4" rx="2" fill="#0891b2"/>
  <text x="315" y="180" text-anchor="middle" fill="#0e7490" font-size="12.5" font-weight="700">工具 Tool</text>
  <text x="315" y="203" text-anchor="middle" fill="#374151" font-size="9">九元组注册 · 统一路由</text>
  <text x="315" y="220" text-anchor="middle" fill="#374151" font-size="9">四层校验链（P6）</text>
  <text x="315" y="237" text-anchor="middle" fill="#374151" font-size="9">白名单→Schema→权限→沙箱</text>
  <text x="315" y="260" text-anchor="middle" fill="#374151" font-size="9">五源 LOCAL/SPI/MCP/REST/Skill</text>
  <text x="315" y="277" text-anchor="middle" fill="#374151" font-size="9">MCP 四传输 · OpenAPI 发现</text>

  <!-- ===== C 上下文 ===== -->
  <rect x="420" y="150" width="170" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="421" y="151" width="168" height="4" rx="2" fill="#059669"/>
  <text x="505" y="180" text-anchor="middle" fill="#065f46" font-size="12.5" font-weight="700">上下文 Context</text>
  <text x="505" y="203" text-anchor="middle" fill="#374151" font-size="9">四级记忆 L1–L4 · 双画像</text>
  <text x="505" y="220" text-anchor="middle" fill="#374151" font-size="9">语义召回 + Rerank 去噪</text>
  <text x="505" y="243" text-anchor="middle" fill="#374151" font-size="9">Token 预算 · 脱敏过滤</text>
  <text x="505" y="260" text-anchor="middle" fill="#374151" font-size="9">向量库可插拔</text>

  <!-- ===== S 状态 ===== -->
  <rect x="610" y="150" width="170" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="611" y="151" width="168" height="4" rx="2" fill="#d97706"/>
  <text x="695" y="180" text-anchor="middle" fill="#92400e" font-size="12.5" font-weight="700">状态 State</text>
  <text x="695" y="203" text-anchor="middle" fill="#374151" font-size="9">快照 / 断点续跑 · 乐观锁</text>
  <text x="695" y="220" text-anchor="middle" fill="#374151" font-size="9">分布式锁 · 幂等键</text>
  <text x="695" y="243" text-anchor="middle" fill="#374151" font-size="9">Redis 热层（memory 兜底）</text>
  <text x="695" y="260" text-anchor="middle" fill="#374151" font-size="9">事务回滚</text>

  <!-- ===== L 生命周期（全流程贯穿，虚线框） ===== -->
  <rect x="800" y="150" width="170" height="190" rx="8" fill="#fff7ed" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6,3"/>
  <rect x="801" y="151" width="168" height="4" rx="2" fill="#dc2626"/>
  <text x="885" y="180" text-anchor="middle" fill="#b91c1c" font-size="12.5" font-weight="700">生命周期 Lifecycle</text>
  <text x="885" y="203" text-anchor="middle" fill="#374151" font-size="9">12 拦截点 · 钩子引擎</text>
  <text x="885" y="220" text-anchor="middle" fill="#374151" font-size="9">HookAction：ABORT/SKIP/MODIFY</text>
  <text x="885" y="237" text-anchor="middle" fill="#374151" font-size="9">注入检测 · 输出审核 · 高危审批</text>
  <text x="885" y="260" text-anchor="middle" fill="#374151" font-size="9">四层纵深防御</text>

  <!-- ===== V 可观测 ===== -->
  <rect x="990" y="150" width="170" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="991" y="151" width="168" height="4" rx="2" fill="#4f46e5"/>
  <text x="1075" y="180" text-anchor="middle" fill="#3730a3" font-size="12.5" font-weight="700">可观测 Evaluation</text>
  <text x="1075" y="203" text-anchor="middle" fill="#374151" font-size="9">五维指标：Sched·Tool·Model</text>
  <text x="1075" y="220" text-anchor="middle" fill="#374151" font-size="9">Sec · Decision</text>
  <text x="1075" y="243" text-anchor="middle" fill="#374151" font-size="9">Prometheus + MQ · 分级告警</text>
  <text x="1075" y="260" text-anchor="middle" fill="#374151" font-size="9">Trace · 审计不可篡改</text>

  <!-- ===== 生成式 LLM（System-2） ===== -->
  <rect x="40" y="430" width="560" height="78" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="320" y="456" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">生成式 LLM（System-2）· M1–M6 模型矩阵 + LlmGateway</text>
  <text x="320" y="474" text-anchor="middle" fill="#374151" font-size="9.5">角色→模型 · 主备降级 · Provider 熔断 · SecretResolver</text>
  <text x="320" y="492" text-anchor="middle" fill="#374151" font-size="9.5">经 E 组件调用（M4 工具调用 / M5 规划 / M6 长上下文）</text>
  <line x1="125" y1="430" x2="125" y2="342" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#m-green)"/>
  <text x="135" y="392" fill="#059669" font-size="9">推理</text>

  <!-- ===== RSI 递归自演进 ===== -->
  <rect x="620" y="430" width="540" height="78" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="890" y="456" text-anchor="middle" fill="#0f766e" font-size="12" font-weight="700">RSI 递归自演进 · 离线元循环 R0–R5/R-G</text>
  <text x="890" y="474" text-anchor="middle" fill="#374151" font-size="9.5">Observe→Evaluate→Propose→Validate→Apply→Monitor</text>
  <text x="890" y="492" text-anchor="middle" fill="#374151" font-size="9.5">消费 V 轨迹/指标 → 候选提案（回放 + 灰度 + 审批，P11）</text>
  <line x1="1075" y1="340" x2="1075" y2="428" stroke="#0d9488" stroke-width="1.5" fill="none" marker-end="url(#m-teal)"/>
  <text x="1045" y="392" text-anchor="end" fill="#0d9488" font-size="9">轨迹/指标</text>

  <!-- ===== 底部注解 ===== -->
  <text x="600" y="548" text-anchor="middle" fill="#6b7280" font-size="10">六组件正交（P4）：可替换 · 可独立测试 · 可独立降级；L 生命周期钩子全流程贯穿 12 拦截点（虚线框）</text>
</svg>
